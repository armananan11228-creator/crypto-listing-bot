name: Spot Buy Bot

# هر ساعت، ۵ دقیقه بعد از بسته‌شدن کندل ۱ ساعته اجرا می‌شود
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      # وضعیت معامله‌های باز بین اجراها حفظ می‌شود
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: spot-bot-state-${{ github.run_id }}
          restore-keys: spot-bot-state-

      - name: Scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          INTERVAL: "1h"
          MIN_SCORE: "65"
          HOLD_HOURS: "12"
          MAX_POSITIONS: "5"
          SUMMARY_EVERY: "6"
        run: python3 spot_bot.py --once

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: spot-bot-state-${{ github.run_id }}
